<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .panel{fill:#ffffff;stroke:#b0b0b0;stroke-width:1.5;rx:10}
    .ptitle{font-size:19px;font-weight:bold;fill:#1a1a1a;text-anchor:middle}
    .pl{font-size:15px;font-weight:bold;fill:#1a1a1a}
    .purple{fill:#e2d7f0;stroke:#7e57c2;stroke-width:1.5}
    .green{fill:#d9ead3;stroke:#4c9a2a;stroke-width:1.5}
    .grey{fill:#eeeeee;stroke:#999;stroke-width:1.5}
    .yellow{fill:#fff5d6;stroke:#e0a800;stroke-width:1.6;stroke-dasharray:6 4}
    .lbl{font-size:12.5px;fill:#1a1a1a;text-anchor:middle}
    .lbls{font-size:11px;fill:#333;text-anchor:middle}
    .flow{fill:none;stroke:#2b6cb0;stroke-width:2;marker-end:url(#arr)}
    .flowk{fill:none;stroke:#333;stroke-width:1.6;marker-end:url(#arrk)}
    .dash{fill:none;stroke:#666;stroke-width:1.4;stroke-dasharray:4 3}
    .op{font-size:15px;fill:#111;text-anchor:middle;font-weight:bold}
    .note{font-size:11px;fill:#7a5b00;text-anchor:middle;font-style:italic}
  </style>

  <!-- ===================== PANEL A ===================== -->
  <rect class="panel" x="8" y="8" width="686" height="374" rx="10"/>
  <text class="pl" x="22" y="34">A</text>
  <text class="ptitle" x="351" y="34">High-Level System Architecture</text>

  <!-- FER input -->
  <circle cx="70" cy="150" r="34" fill="#fde2c8" stroke="#e08a3c"/>
  <text x="70" y="156" font-size="26" text-anchor="middle">🙂</text>
  <text class="lbls" x="70" y="210">Facial Emotion</text>
  <text class="lbls" x="70" y="224">Recognition (FER)</text>
  <text class="lbls" x="70" y="238">Input</text>
  <path class="flow" d="M108,150 L150,150"/>

  <text x="330" y="60" class="lbl" font-weight="bold">YOLOv8</text>
  <!-- backbone -->
  <rect class="purple" x="160" y="72" width="95" height="150" rx="6"/>
  <text class="lbl" x="207" y="66">Backbone</text>
  <!-- neck (trapezoid) -->
  <polygon class="purple" points="285,80 405,80 375,215 315,215" />
  <text class="lbl" x="345" y="66">Neck</text>
  <text class="lbl" x="345" y="150">Proposed</text>
  <text class="lbl" x="345" y="166">FLEO Block</text>
  <!-- head -->
  <rect class="purple" x="440" y="80" width="150" height="145" rx="6"/>
  <text class="lbl" x="515" y="66">Head</text>
  <rect x="452" y="95" width="126" height="45" rx="5" fill="#ffffff" stroke="#7e57c2"/>
  <text class="lbls" x="515" y="114">Detection</text>
  <text class="lbls" x="515" y="130">(P3 / P4 / P5)</text>
  <rect x="452" y="150" width="126" height="55" rx="5" fill="#ffffff" stroke="#7e57c2"/>
  <text class="lbls" x="515" y="170">Emotion</text>
  <text class="lbls" x="515" y="184">Detections</text>
  <text class="lbls" x="515" y="198">(7 classes)</text>

  <path class="flow" d="M255,150 L285,150"/>
  <path class="flow" d="M405,150 L440,150"/>
  <path class="flow" d="M590,150 L625,150"/>
  <text class="lbls" x="655" y="140">Grader</text>
  <text class="lbls" x="655" y="154">Membership</text>
  <text class="lbls" x="351" y="300" font-weight="bold" fill="#7e57c2">YOLOv8 backbone → neck (FLEO) → detection head</text>

  <!-- ===================== PANEL B ===================== -->
  <rect class="panel" x="726" y="8" width="686" height="374" rx="10"/>
  <text class="pl" x="740" y="34">B</text>
  <text class="ptitle" x="1069" y="34">Panel B: FLEO Block Logic (Detailed)</text>

  <!-- input X from neck -->
  <text class="lbl" x="770" y="150" font-weight="bold">X</text>
  <text class="lbls" x="770" y="164">from neck</text>
  <path class="flow" d="M792,155 L815,155"/>

  <!-- top attention path -->
  <text class="lbls" x="905" y="70" font-weight="bold">X (from neck)</text>
  <rect class="purple" x="815" y="80" width="70" height="34" rx="5"/>
  <text class="lbls" x="850" y="101">Conv 1×1</text>
  <path class="flow" d="M885,97 L905,97"/>
  <rect class="purple" x="905" y="80" width="80" height="34" rx="5"/>
  <text class="lbls" x="945" y="97">AvgPool</text>
  <text class="lbls" x="945" y="109">global</text>
  <path class="flow" d="M985,97 L1010,97"/>
  <rect class="purple" x="1010" y="80" width="90" height="34" rx="5"/>
  <text class="lbls" x="1055" y="101">Conv 1×1 (·σ)</text>
  <text class="lbls" x="1055" y="70" font-weight="bold">Main Orthogonalization Path</text>
  <path class="flow" d="M1100,97 L1150,97 L1150,135"/>
  <!-- s label on attention output -->
  <text class="op" x="1128" y="128" fill="#c0392b">s</text>

  <!-- bottom main path -->
  <rect class="purple" x="815" y="138" width="70" height="34" rx="5"/>
  <text class="lbls" x="850" y="159">Conv 1×1</text>
  <path class="flow" d="M885,155 L905,155"/>
  <rect class="purple" x="905" y="138" width="90" height="34" rx="5"/>
  <text class="lbls" x="950" y="153">split</text>
  <text class="lbls" x="950" y="167">(K subspaces)</text>
  <path class="flow" d="M995,155 L1015,155"/>
  <rect class="purple" x="1015" y="138" width="115" height="34" rx="5"/>
  <text class="lbls" x="1072" y="153">Gram–Schmidt</text>
  <text class="lbls" x="1072" y="167">orthogonalize</text>
  <!-- U tilde label on GS output -->
  <text class="op" x="1150" y="188" fill="#c0392b">&#360;<tspan font-size="10" dy="4">1</tspan><tspan dy="-4">…</tspan>&#360;<tspan font-size="10" dy="4">K</tspan></text>
  <path class="flow" d="M1130,155 L1150,155 L1150,150"/>

  <!-- multiply node -->
  <circle cx="1150" cy="160" r="12" fill="#fff" stroke="#111"/>
  <text class="op" x="1150" y="165">&#8857;</text>
  <text class="lbls" x="1150" y="205" font-weight="bold">Multiply (&#8857;)</text>
  <path class="flow" d="M1162,160 L1195,160"/>

  <!-- conv 3x3 -->
  <rect class="green" x="1195" y="143" width="95" height="34" rx="5"/>
  <text class="lbls" x="1242" y="158">Conv 3×3</text>
  <text class="lbls" x="1242" y="171">(c&#8321; = K·d)</text>
  <path class="flow" d="M1242,177 L1242,200"/>
  <!-- add residual -->
  <rect class="green" x="1185" y="200" width="115" height="30" rx="5"/>
  <text class="lbls" x="1242" y="219">Add Residual + X</text>
  <path class="flow" d="M1242,230 L1242,250"/>
  <!-- Y output -->
  <rect x="1215" y="250" width="55" height="34" rx="6" fill="#d9ead3" stroke="#4c9a2a" stroke-width="2"/>
  <text class="op" x="1242" y="272">Y</text>
  <text class="lbls" x="1330" y="205">Y (enhanced</text>
  <text class="lbls" x="1330" y="219">feature map)</text>
  <path class="dash" d="M1270,267 C1310,267 1330,235 1330,225"/>
  <!-- residual skip arrow from X to add -->
  <path class="dash" d="M780,168 C780,300 1180,315 1200,232"/>

  <!-- training-only box -->
  <rect class="yellow" x="815" y="292" width="500" height="80" rx="8"/>
  <text class="note" x="1065" y="308" font-weight="bold">TRAINING-TIME ONLY &#8226; folded out at export</text>
  <rect x="828" y="318" width="110" height="40" rx="5" fill="#fff" stroke="#e0a800"/>
  <text class="lbls" x="883" y="334">Binding Head</text>
  <text class="lbls" x="883" y="348">(per-subspace)</text>
  <text class="lbls" x="985" y="332" font-style="italic">c&#8202;<tspan font-size="9" dy="3">out</tspan><tspan dy="-3"> = u&#8202;L(&#968;(&#963;(h)))</tspan></text>
  <!-- fuzzy label bars -->
  <text class="lbls" x="1120" y="322">Fuzzy label &#956;</text>
  <rect x="1095" y="330" width="8" height="20" fill="#7e57c2"/>
  <rect x="1107" y="338" width="8" height="12" fill="#7e57c2"/>
  <rect x="1119" y="326" width="8" height="24" fill="#7e57c2"/>
  <rect x="1131" y="340" width="8" height="10" fill="#7e57c2"/>
  <text class="lbls" x="1120" y="362">grader membership</text>
  <rect x="1200" y="322" width="40" height="30" rx="4" fill="#fff" stroke="#e0a800"/>
  <text class="lbls" x="1220" y="335">P</text>
  <text class="lbls" x="1220" y="347">posterior</text>
  <text class="lbls" x="1285" y="335" font-style="italic">&#8467;<tspan font-size="9" dy="3">FGS</tspan></text>
  <text class="note" x="1285" y="360">fuzzy supervision</text>
  <text class="note" x="1285" y="372">(training-only)</text>

  <!-- ===================== PANEL C ===================== -->
  <rect class="panel" x="8" y="398" width="686" height="374" rx="10"/>
  <text class="pl" x="22" y="424">C</text>
  <text class="ptitle" x="351" y="424">Fold-out Graph Rewrite</text>

  <text class="lbl" x="180" y="452" font-weight="bold">Training Graph</text>
  <!-- training graph -->
  <text class="lbl" x="70" y="530" font-weight="bold">X</text>
  <text class="lbls" x="70" y="544">from neck</text>
  <path class="flowk" d="M90,535 L112,535"/>
  <rect class="purple" x="112" y="475" width="80" height="26" rx="4"/>
  <text class="lbls" x="152" y="492">Conv 1×1</text>
  <rect class="purple" x="112" y="520" width="80" height="30" rx="4"/>
  <text class="lbls" x="152" y="539">Split K sub.</text>
  <rect class="purple" x="112" y="560" width="80" height="26" rx="4"/>
  <text class="lbls" x="152" y="577">AvgPool global</text>
  <rect class="green" x="112" y="595" width="80" height="30" rx="4"/>
  <text class="lbls" x="152" y="614">Sigmoid</text>
  <path class="flowk" d="M192,488 L215,488 L215,540"/>
  <path class="flowk" d="M192,535 L215,535"/>
  <path class="flowk" d="M192,573 L205,573 L205,545"/>
  <path class="flowk" d="M192,610 L210,610 L210,548"/>
  <circle cx="222" cy="540" r="10" fill="#fff" stroke="#111"/>
  <text class="op" x="222" y="545">&#8853;</text>
  <path class="flowk" d="M232,540 L265,540"/>
  <rect class="green" x="265" y="522" width="95" height="34" rx="5"/>
  <text class="lbls" x="312" y="537">Conv 1×1</text>
  <text class="lbls" x="312" y="551">(·σ)</text>
  <path class="flowk" d="M360,539 L390,539"/>
  <circle cx="402" cy="539" r="11" fill="#fff" stroke="#111"/>
  <text class="op" x="402" y="544">&#8857;</text>

  <!-- training-only yellow -->
  <rect class="yellow" x="60" y="640" width="330" height="60" rx="8"/>
  <text class="lbls" x="150" y="662" font-weight="bold">Fuzzy Label (per-subspace)</text>
  <text class="lbls" x="150" y="682">P posterior</text>
  <text class="lbls" x="300" y="672" font-style="italic">e&#8202;<tspan font-size="9" dy="3">out</tspan><tspan dy="-3">= u&#8202;L(&#968;(&#963;(h)))</tspan></text>

  <text class="lbl" x="540" y="452" font-weight="bold">Inference Graph</text>
  <!-- inference graph greyed -->
  <rect class="grey" x="470" y="475" width="80" height="26" rx="4"/>
  <text class="lbls" x="510" y="492" fill="#888">Conv 1×1</text>
  <rect class="grey" x="470" y="515" width="80" height="30" rx="4"/>
  <text class="lbls" x="510" y="534" fill="#888">Split K sub.</text>
  <rect class="grey" x="470" y="555" width="80" height="26" rx="4"/>
  <text class="lbls" x="510" y="572" fill="#888">AvgPool global</text>
  <rect class="grey" x="470" y="590" width="80" height="26" rx="4"/>
  <text class="lbls" x="510" y="607" fill="#888">Conv 1×1 (sigmoid)</text>
  <line x1="575" y1="490" x2="640" y2="600" stroke="#c0392b" stroke-width="3"/>
  <line x1="640" y1="490" x2="575" y2="600" stroke="#c0392b" stroke-width="3"/>
  <text class="lbls" x="560" y="640" fill="#888" font-style="italic">Fuzzy supervision removed</text>
  <text class="lbl" x="560" y="690" font-weight="bold">↓ Simplified path for deployment</text>

  <!-- ===================== PANEL D ===================== -->
  <rect class="panel" x="726" y="398" width="686" height="374" rx="10"/>
  <text class="pl" x="740" y="424">D</text>
  <text class="ptitle" x="1069" y="424">FPGA Deployment Flow</text>

  <rect x="770" y="470" width="120" height="50" rx="6" fill="#eaf1fb" stroke="#2b6cb0"/>
  <text class="lbl" x="830" y="492">Fold-out</text>
  <text class="lbl" x="830" y="508">graph</text>
  <path class="flow" d="M890,495 L935,495"/>
  <rect x="935" y="470" width="120" height="50" rx="6" fill="#ffffff" stroke="#666"/>
  <text class="lbl" x="995" y="492">Compile</text>
  <text class="lbls" x="995" y="508">(to .xmodel)</text>
  <path class="flow" d="M1055,495 L1095,495"/>

  <!-- board -->
  <rect x="1100" y="455" width="290" height="150" rx="8" fill="#1e2a20" stroke="#111"/>
  <text class="lbls" x="1245" y="472" fill="#cfe8cf" font-weight="bold">ZCU104 Zynq UltraScale+ MPSoC</text>
  <rect x="1120" y="485" width="60" height="100" rx="4" fill="#2f4030" stroke="#5a7a5a"/>
  <text class="lbls" x="1150" y="540" fill="#cfe8cf">DPU</text>
  <rect x="1190" y="490" width="180" height="45" rx="4" fill="#3a6b3a" stroke="#7bbf7b"/>
  <text class="lbls" x="1280" y="508" fill="#eaffea" font-weight="bold">B4096 DPU</text>
  <text class="lbls" x="1280" y="524" fill="#eaffea">300 MHz — 1.22 TOPS</text>
  <rect x="1190" y="545" width="180" height="35" rx="4" fill="#555" stroke="#999"/>
  <text class="lbls" x="1280" y="566" fill="#eee">PS (ARM A53)</text>

  <text class="lbls" x="775" y="645" text-anchor="start">&#8226; DPU-native: DPU executes core convolutional layers.</text>
  <text class="lbls" x="775" y="665" text-anchor="start">&#8226; Orthogonalization folded out — no PS fallback at inference.</text>
  <text class="lbls" x="775" y="685" text-anchor="start">&#8226; PS (ARM) handles only control / pre-post processing.</text>
</svg>
